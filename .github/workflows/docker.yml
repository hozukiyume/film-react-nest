# GitHub Actions workflow: собирает три Docker-образа и пушит их в GitHub Container Registry
name: Docker CI

# Когда запускать - при пуше в main или review-2
on:
  push:
    branches:
      - main
      - review-2

# Права GITHUB_TOKEN необходимы для пуша
permissions:
  contents: read # чтение репозитория
  packages: write # запись образов

jobs:
  build-and-push:
    runs-on: ubuntu-latest # виртуальная машина GitHub с Docker для запуска workflow

    steps:
      # Клонирование репозитория для сборки Dockerfile и исходников
      - name: Checkout repository
        uses: actions/checkout@v4

      # Подключение Buildx - расширение docker build с кэшированием и мультиплатформенной сборкой
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в ghcr.io
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # кто запускает workflow
          password: ${{ secrets.GITHUB_TOKEN }} # автоматический токен GitHub

      # Сборка и пуш образа бэкенда
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend # папка с Dockerfile
          push: true # пуш сразу в реестр
          tags: ghcr.io/hozukiyume/film-backend:latest # имя образа в ghcr.io; тег latest перезаписывается при каждом пуше

      # Сборка и пуш образа фронтенда
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/hozukiyume/film-frontend:latest

      # Сборка и пуш образа nginx
      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/hozukiyume/film-nginx:latest