# Единственный сервер-блок: обслуживает домен, раздаёт статику и проксирует /api/ и /content/ внутри сети film-network
server {
    listen 80; # Принимаем запросы с порта 80
    server_name _; # Указываем название домена

    # Папка со статикой фронтенда - сюда монтируется volume frontend_dist
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: сначала пробуем отдать файл ($uri) или папку ($uri/), если не нашли - отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на бэкенд
    location /api/ {
        proxy_pass http://backend:3000; # Перенаправляем запросы на порт 3000
        proxy_http_version 1.1; # Задаёт версию HTTP для прокси
        proxy_set_header Host $host; # Содержит адрес домена, на который пришёл запрос
        proxy_set_header X-Real-IP $remote_addr; # Реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Реальный IP клиента
        proxy_set_header X-Forwarded-Proto $scheme; # Оригинальный протокол (http/https)
    }

    # Проксирование статики бэкенда
    location /content/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}